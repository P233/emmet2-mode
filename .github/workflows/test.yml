name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - id: versions
        run: node -e 'console.log("node="+require("./test/dependencies.json").node)' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ steps.versions.outputs.node }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run oracle:check
      - name: Oracle with networking and writes denied
        run: sudo unshare --net -- "$(command -v node)" --permission --allow-fs-read=. test/oracle/gen.mjs --check

  emacs:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        version: ["30.2", "31.1"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - id: versions
        run: node -e 'console.log("node="+require("./test/dependencies.json").node)' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ steps.versions.outputs.node }}
          package-manager-cache: false
      - name: Build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential texinfo libncurses-dev pkg-config
      - name: Build pinned Emacs and tree-sitter
        env:
          EMMET2_EMACS_VERSION: ${{ matrix.version }}
        run: |
          emacs_binary=$(node test/build-emacs.mjs "$EMMET2_EMACS_VERSION" "$RUNNER_TEMP/emacs-build")
          echo "EMMET2_EMACS=$emacs_binary" >> "$GITHUB_ENV"
      - name: Install isolated test dependencies
        run: |
          node test/setup.mjs "$RUNNER_TEMP/emmet2-deps"
          echo "EMMET2_TEST_DEPS=$RUNNER_TEMP/emmet2-deps" >> "$GITHUB_ENV"
      - name: Byte compilation (warnings fail)
        run: '"$EMMET2_EMACS" --batch -Q -L . -l test/byte-compile.el'
      - name: Package metadata and documentation
        run: '"$EMMET2_EMACS" --batch -Q -L . -l test/package-quality.el'
      - name: Complete native contracts without external processes
        run: '"$EMMET2_EMACS" --batch -Q -L . -l test/integration.el'
      - name: Byte-compiled editor and optional dependencies
        run: '"$EMMET2_EMACS" --batch -Q -L . -l test/editor-bytecode.el'
      - name: Actual isolated package installation without external runtimes
        env:
          EMMET2_INSTALL_ROOT: ${{ runner.temp }}/emmet2-install
        run: '"$EMMET2_EMACS" --batch -Q -l test/install.el'
      - name: Complete native contracts from installed bytecode
        env:
          EMMET2_TEST_PACKAGE: ${{ runner.temp }}/emmet2-install/straight/build/emmet2-mode
        run: '"$EMMET2_EMACS" --batch -Q -l test/integration.el'
      - name: Build diagnostics
        if: failure()
        run: |
          if test -f "$RUNNER_TEMP/emacs-build/build.log"; then
            tail -n 150 "$RUNNER_TEMP/emacs-build/build.log"
          fi
